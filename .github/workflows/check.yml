name: Check

# Runs the deploy workflow's checks on pull requests (including Dependabot's), so a
# breaking change shows up before it is merged. Builds with the committed stats.json, and
# publishes and commits nothing (the Pages upload and deploy only run on main).
# Keep the steps in step with build-and-deploy in deploy.yml.
on:
  pull_request:
    # edited: a stacked PR moved to a new base gets checked against it
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    # skip edits to the title or body; only a base change needs a new check
    if: github.event.action != 'edited' || github.event.changes.base
    # at job level, so a skipped title/body edit run never cancels a running check
    concurrency:
      group: check-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # headless Chrome in build:pdf can hang; don't hold a runner for the 6-hour default
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing here needs git auth; keep the token away from dependency code
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm lint

      - run: pnpm test:run

      # syntax check only: fetch-stats falls back to the committed stats on any error, so
      # running it would pass anyway and only add calls to the external APIs
      - run: for f in scripts/*.mjs; do node --check "$f"; done

      - run: pnpm build

      # the runner's preinstalled Google Chrome, as in deploy.yml
      - run: pnpm build:pdf
