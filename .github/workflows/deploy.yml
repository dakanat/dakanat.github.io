name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write # to commit refreshed stats (see below)
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm lint

      - run: pnpm test:run

      - run: pnpm fetch-stats

      # On the monthly schedule (and manual runs), commit stats.json when it was refreshed.
      # Besides keeping the numbers in the repo up to date, the commit counts as repository
      # activity, so GitHub does not disable this scheduled workflow after 60 quiet days.
      # Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
      - name: Commit refreshed stats
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- src/data/stats.json; then
            echo "stats.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/stats.json
          git commit -m "chore(data): refresh AtCoder and Semantic Scholar stats"
          git pull --rebase
          git push

      - run: pnpm build

      # renders out/cv-ja.pdf and out/cv-en.pdf with the runner's preinstalled Google Chrome
      - run: pnpm build:pdf

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
