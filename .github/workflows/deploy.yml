name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Monthly (and manual) runs refresh the stats and commit stats.json. Besides keeping the
  # numbers in the repo current, the commit counts as repository activity, so GitHub does not
  # disable this scheduled workflow after 60 quiet days. This is the only job with write
  # access, and it runs no third-party code: fetch-stats uses Node built-ins only.
  # Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
  refresh-stats:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the write token is handed to the push below only, not stored in .git/config
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # no pnpm in this job (nothing is installed), so skip setup-node's automatic
          # pnpm cache, which it enables because package.json has a packageManager field
          package-manager-cache: false

      - run: node scripts/fetch-stats.mjs

      - name: Commit refreshed stats
        env:
          TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/stats.json; then
            echo "stats.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/stats.json
          git commit -m "chore(data): refresh AtCoder and Semantic Scholar stats"
          # pass the token as a header (as actions/checkout does), so it never appears in a
          # URL that git may print
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" pull --rebase
          git -c http.extraheader="$auth" push

  build-and-deploy:
    needs: refresh-stats
    # deploy even when refresh-stats was skipped (pushes) or failed (old stats are kept)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read # deploy-pages reads the uploaded artifact
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # headless Chrome in build:pdf can hang; don't hold the pages concurrency group for
    # the 6-hour default
    timeout-minutes: 20
    steps:
      # the branch tip, so a stats commit made by refresh-stats is included
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          # nothing here pushes (the repo is public, so ls-remote below needs no auth);
          # keep the token away from dependency code
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install

      - run: pnpm lint

      - run: pnpm test:run

      # on pushes this refreshes the stats for the build (no commit); right after
      # refresh-stats it skips, since the stats are less than a day old
      - run: pnpm fetch-stats

      - run: pnpm build

      # renders out/cv-ja.pdf and out/cv-en.pdf with the runner's preinstalled Google Chrome
      - run: pnpm build:pdf

      # Publish only if what was built is still the branch tip. If a newer commit has landed in
      # the meantime, its own run deploys it; this keeps a slow or delayed run (e.g. one that sat
      # queued) from overwriting the site with older content.
      - name: Check that this is still the latest commit
        id: latest
        run: |
          built=$(git rev-parse HEAD)
          tip=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ -n "$tip" ] && [ "$tip" != "$built" ]; then
            echo "::notice::Built ${built} but ${GITHUB_REF_NAME} is now at ${tip}; leaving the deploy to that commit's run."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.latest.outputs.deploy == 'true'
        with:
          path: out

      - id: deployment
        if: steps.latest.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
